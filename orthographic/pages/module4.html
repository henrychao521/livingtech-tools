<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模組 4：3D ↔ 三視圖模擬</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="../../css/svg-effects.css"><link rel="stylesheet" href="../css/orthographic.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📐%3C/text%3E%3C/svg%3E">
<style>.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:14px}.tab{padding:10px;text-align:center;font-size:12px;border-radius:6px;background:#f1f5f9;cursor:pointer;font-weight:700}.tab.active{background:#4F46E5;color:#fff}</style>
</head><body class="ort-theme">
<header class="topbar"><div class="brand"><span class="logo">📐</span><div><h1>三視圖</h1><p class="subtitle">生活科技互動教學平台</p></div></div><a href="../index.html" class="module-back">← 回首頁</a></header>
<main class="module-page">
  <div class="module-header"><div><span class="module-step" style="background:var(--success-light);color:#1b6e3a">MODULE 04 ・ 核心</span><h2>3D 物件 → 三視圖</h2><p class="muted">選擇物件看正視 / 側視 / 俯視即時對應。</p></div></div>
  <div class="practice-layout">
    <div class="ort-canvas-wrap">
      <canvas id="ort-canvas" width="760" height="560"></canvas>
    </div>
    <div class="sim-side">
      <div style="background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px">
        <h4 style="font-size:13px;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px">選擇物件</h4>
        <div class="tabs">
          <div class="tab active" data-s="cube">立方體</div>
          <div class="tab" data-s="cylinder">圓柱</div>
          <div class="tab" data-s="step">階梯塊</div>
        </div>
        <div class="tabs" style="margin-top:6px">
          <div class="tab" data-s="l">L 型塊</div>
          <div class="tab" data-s="hole">孔板</div>
          <div class="tab" data-s="cone">圓錐</div>
        </div>
        <div style="margin-top:14px;background:#E0E7FF;padding:12px;border-radius:8px;font-size:13px;color:#3730A3" id="info">立方體：6 個面都一樣 = 三視圖都是正方形</div>
      </div>
      <div class="help-card">
        <strong>💡 觀察重點</strong>
        <ul>
          <li>對齊：正視寬 = 俯視寬</li>
          <li>高平齊：正視高 = 側視高</li>
          <li>圓變方？或方變圓？</li>
          <li>是否有虛線（內部結構）</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="module-nav-bottom"><a href="module3.html" class="btn btn-ghost">← 上一關</a><a href="module5.html" class="btn btn-primary">下一關 →</a></div>
</main>
<script src="../../js/main.js"></script><script src="../../js/audio.js"></script><script src="../js/module4.js"></script>
</body></html>
