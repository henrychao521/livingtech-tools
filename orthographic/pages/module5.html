<style>
  .round-tabs{display:flex;gap:6px;margin-bottom:16px}
  .round-tab{flex:1;padding:14px 8px;background:#F1F5F9;border-radius:10px;cursor:pointer;text-align:center;font-weight:700;transition:all .25s;border:2px solid transparent}
  .round-tab.active{background:#4F46E5;color:#fff;transform:translateY(-2px);box-shadow:0 6px 16px rgba(79,70,229,.3)}
  .round-tab.done{background:#16A34A;color:#fff}
  .round-tab small{display:block;font-weight:500;opacity:.8;font-size:10.5px;margin-top:2px}
  .qcard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;border-left:6px solid #4F46E5}
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .qbadge{background:#4F46E5;color:#fff;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700}
  .qprompt{font-size:14px;color:#1E1B4B;margin:6px 0}
  .view-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .view-cell{background:#0F172A;border-radius:8px;padding:8px;text-align:center}
  .view-cell svg{display:block;margin:0 auto;background:#1E293B;border-radius:4px}
  .view-cell-label{font-size:10.5px;color:#FBBF24;font-family:Inter;letter-spacing:.05em;margin-top:6px}
  .opt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .opt-cell{background:#fff;border:2px solid var(--border);border-radius:10px;cursor:pointer;padding:6px;transition:all .2s;text-align:center}
  .opt-cell:hover:not(.disabled){border-color:#4F46E5;transform:translateY(-2px)}
  .opt-cell.disabled{cursor:not-allowed;opacity:.7}
  .opt-cell.correct{border-color:#16A34A;background:#DCFCE7}
  .opt-cell.wrong{border-color:#dc2626;background:#FEE2E2}
  .opt-cell canvas, .opt-cell svg{display:block;margin:0 auto;background:#1E293B;border-radius:4px}
  .opt-label{font-size:11px;color:#475569;margin-top:4px;font-weight:600}
  .feedback{margin-top:10px;padding:10px;border-radius:8px;font-size:13px}
  .feedback.success{background:#DCFCE7;color:#15803d;border-left:4px solid #16A34A}
  .feedback.error{background:#FEE2E2;color:#991b1b;border-left:4px solid #dc2626}
  .hint-toggle{font-size:12px;color:#4F46E5;cursor:pointer;text-decoration:underline}
  .stack-game{background:#0F172A;border-radius:12px;padding:14px;color:#CBD5E1}
  .stack-layout{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:10px}
  .stack-3d{height:380px;background:#1E293B;border-radius:8px;position:relative;overflow:hidden;cursor:crosshair}
  .stack-views{display:grid;grid-template-rows:repeat(3,1fr);gap:8px}
  .stack-view{background:#1E293B;border-radius:8px;padding:10px;display:flex;align-items:center;justify-content:space-around;font-size:11px}
  .stack-view .vlabel{color:#FBBF24;font-weight:700;letter-spacing:.05em;font-size:10.5px}
  .stack-view canvas{background:#0F172A;border-radius:4px;border:1px solid #334155}
  .stack-toolbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .stack-toolbar button{padding:8px 14px;background:rgba(99,102,241,.25);color:#E0E7FF;border:1px solid #4F46E5;border-radius:6px;cursor:pointer;font-weight:700;font-size:13px}
  .stack-toolbar button:hover{background:rgba(99,102,241,.5)}
  .stack-toolbar button.danger{border-color:#dc2626;color:#FCA5A5}
  .match-bar{height:14px;background:#1E293B;border-radius:99px;overflow:hidden;margin-top:8px;border:1px solid #334155}
  .match-bar-fill{height:100%;background:linear-gradient(90deg,#dc2626,#FBBF24,#16A34A);transition:width .35s}
  .score-pill{background:#FBBF24;color:#1E1B4B;padding:6px 14px;border-radius:99px;font-weight:800;font-family:Inter;font-size:13px}
  .legend{display:flex;gap:14px;margin-top:8px;font-size:12px;color:#CBD5E1;flex-wrap:wrap}
  .legend-item{display:flex;align-items:center;gap:6px}
  .legend-dot{width:14px;height:14px;border-radius:3px;display:inline-block}
</style>
