<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模組 1：認識結構</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/structure-sim.css">

</head>
<body data-tool="structure-sim" class="struct-theme">
<header class="topbar"><div class="brand"><span class="logo">🏛</span><div><h1>結構模擬器</h1><p class="subtitle">生活科技互動教學平台</p></div></div><a href="../index.html" class="module-back">← 回首頁</a></header>
<main class="module-page">
  <div class="module-header"><div><span class="module-step">MODULE 01</span><h2>認識結構三元素 + 五種內力</h2><p class="muted">點擊圖中藍色標記，認識結構的基本語彙。</p></div><div class="muted" id="progress-text">已認識 0 / 8 項</div></div>
  <!-- OPENSCAD-3D --><section class="panel" style="background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:18px">
    <h3 style="margin:0 0 6px">🏛️ 結構形式立體(可旋轉) <span style="font-size:12px;font-weight:500;color:#64748b;margin-left:6px">點名稱切換 · 拖曳旋轉</span></h3>
    <p class="muted" style="margin-bottom:12px">六種常見結構形式的立體示意,旋轉觀察桿件如何組成。模型由 OpenSCAD 參數化建模(原始檔開源,可改尺寸/3D 列印)。</p>
    <div id="st3d-tabs" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
      <button type="button" class="st3d-btn" data-src="truss.glb">桁架</button>
      <button type="button" class="st3d-btn" data-src="arch.glb">拱</button>
      <button type="button" class="st3d-btn" data-src="frame.glb">剛架</button>
      <button type="button" class="st3d-btn" data-src="shell.glb">殼</button>
      <button type="button" class="st3d-btn" data-src="cable.glb">纜索</button>
      <button type="button" class="st3d-btn" data-src="tensile.glb">張力結構</button>
    </div>
    <div style="background:#1e293b;border-radius:14px;overflow:hidden">
      <model-viewer id="st3d-viewer" src="../assets/models/truss.glb" loading="eager" camera-controls auto-rotate auto-rotate-delay="0" rotation-per-second="22deg" environment-image="neutral" shadow-intensity="1" style="width:100%;height:320px;--poster-color:#1e293b"></model-viewer>
    </div>
    <p class="muted" style="margin-top:8px;font-size:13px">💡 OpenSCAD 原始碼與可列印 STL 在 repo 的 <code>models/structure-sim/</code>(見 models/README)。</p>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <script>
    (function(){
      var v=document.getElementById('st3d-viewer'),tabs=document.querySelectorAll('#st3d-tabs .st3d-btn');
      function sel(b){tabs.forEach(function(x){x.style.background=(x===b)?'#0ea5e9':'#e2e8f0';x.style.color=(x===b)?'#fff':'#0f172a';});}
      tabs.forEach(function(b){
        b.style.cssText='padding:6px 14px;border:none;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600';
        b.addEventListener('click',function(){v.setAttribute('src','../assets/models/'+b.dataset.src);sel(b);});
      });
      sel(tabs[0]);
    })();
    </script>
  </section>
  <div class="parts-layout">
    <div class="saw-stage">
      <svg viewBox="0 0 680 540" class="saw-svg svg-shadow-soft">
        <defs>
          <filter id="m1structShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dx="0" dy="4"/><feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <!-- 背景天空 -->
        <rect x="0" y="0" width="680" height="400" fill="#DBEAFE"/>
        <rect x="0" y="400" width="680" height="140" fill="#a16207"/>

        <!-- 桁架結構（中央示意） -->
        <g filter="url(#m1structShadow)">
          <line x1="120" y1="200" x2="560" y2="200" stroke="#1E3A8A" stroke-width="6"/>
          <line x1="120" y1="380" x2="560" y2="380" stroke="#1E3A8A" stroke-width="6"/>
          <line x1="220" y1="200" x2="220" y2="380" stroke="#1D4ED8" stroke-width="4"/>
          <line x1="340" y1="200" x2="340" y2="380" stroke="#1D4ED8" stroke-width="4"/>
          <line x1="460" y1="200" x2="460" y2="380" stroke="#1D4ED8" stroke-width="4"/>
          <line x1="120" y1="200" x2="220" y2="380" stroke="#3B82F6" stroke-width="4"/>
          <line x1="220" y1="380" x2="340" y2="200" stroke="#3B82F6" stroke-width="4"/>
          <line x1="340" y1="200" x2="460" y2="380" stroke="#3B82F6" stroke-width="4"/>
          <line x1="460" y1="380" x2="560" y2="200" stroke="#3B82F6" stroke-width="4"/>
          <!-- 節點 -->
          <g fill="#DC2626"><circle cx="120" cy="200" r="8"/><circle cx="220" cy="200" r="8"/><circle cx="340" cy="200" r="8"/><circle cx="460" cy="200" r="8"/><circle cx="560" cy="200" r="8"/><circle cx="120" cy="380" r="8"/><circle cx="220" cy="380" r="8"/><circle cx="340" cy="380" r="8"/><circle cx="460" cy="380" r="8"/><circle cx="560" cy="380" r="8"/></g>
        </g>

        <!-- 支承 -->
        <g fill="#1E3A8A">
          <polygon points="108,380 132,380 120,395"/>
          <polygon points="548,380 572,380 560,395"/>
        </g>

        <!-- 載重箭頭 -->
        <line x1="340" y1="100" x2="340" y2="190" stroke="#dc2626" stroke-width="5" marker-end="url(#m1arrow)"/>
        <defs><marker id="m1arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 12 6 L 0 12 z" fill="#dc2626"/></marker></defs>

        <!-- 內力示意（旁邊小圖） -->
        <g transform="translate(60,460)" font-family="Inter" font-size="9" font-weight="700">
          <text x="0" y="-5" fill="#dc2626">張力</text>
          <line x1="0" y1="0" x2="40" y2="0" stroke="#dc2626" stroke-width="3"/>
          <polygon points="0,0 6,-4 6,4" fill="#dc2626"/>
          <polygon points="40,0 34,-4 34,4" fill="#dc2626"/>
        </g>
        <g transform="translate(120,460)" font-family="Inter" font-size="9" font-weight="700">
          <text x="20" y="-5" fill="#1E40AF" text-anchor="middle">壓力</text>
          <line x1="0" y1="0" x2="40" y2="0" stroke="#1E40AF" stroke-width="3"/>
          <polygon points="0,0 6,-4 6,4" fill="#1E40AF" transform="rotate(180 6 0)"/>
          <polygon points="40,0 34,-4 34,4" fill="#1E40AF" transform="rotate(180 34 0)"/>
        </g>

        <!-- 互動熱點 -->
        <g id="hotspots">
          <g class="hotspot-group" data-id="node"><circle class="hotspot-pulse" cx="220" cy="200" r="16"><animate attributeName="r" values="16;24;16" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle><circle class="hotspot" cx="220" cy="200" r="16"/><text class="hotspot-label" x="220" y="205">1</text></g>
          <g class="hotspot-group" data-id="member"><circle class="hotspot" cx="280" cy="200" r="14"/><text class="hotspot-label" x="280" y="204">2</text></g>
          <g class="hotspot-group" data-id="support"><circle class="hotspot" cx="120" cy="395" r="14"/><text class="hotspot-label" x="120" y="399">3</text></g>
          <g class="hotspot-group" data-id="tension"><circle class="hotspot" cx="80" cy="468" r="14"/><text class="hotspot-label" x="80" y="472">4</text></g>
          <g class="hotspot-group" data-id="compression"><circle class="hotspot" cx="140" cy="468" r="14"/><text class="hotspot-label" x="140" y="472">5</text></g>
          <g class="hotspot-group" data-id="shear"><circle class="hotspot" cx="340" cy="290" r="14"/><text class="hotspot-label" x="340" y="294">6</text></g>
          <g class="hotspot-group" data-id="bending"><circle class="hotspot" cx="400" cy="290" r="14"/><text class="hotspot-label" x="400" y="294">7</text></g>
          <g class="hotspot-group" data-id="torsion"><circle class="hotspot" cx="460" cy="290" r="14"/><text class="hotspot-label" x="460" y="294">8</text></g>
        </g>
      </svg>
    </div>
    <div class="parts-info" id="parts-info"><div class="empty"><div class="empty-icon">👆</div><p style="font-size:16px;font-weight:600">點擊藍色數字</p><p style="font-size:13px;opacity:.7">8 個概念都認完才能進下一關</p></div></div>
  </div>
  <div class="parts-checklist" id="parts-checklist"></div>
  <div class="module-nav-bottom"><a href="../index.html" class="btn btn-ghost">← 回首頁</a><a href="module2.html" class="btn btn-primary" id="next-btn" style="opacity:.4;pointer-events:none">下一關 →</a></div>
</main>
