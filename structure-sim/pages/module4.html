<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模組 4：桁架受力模擬器</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/svg-effects.css"><link rel="stylesheet" href="../css/structure-sim.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏛%3C/text%3E%3C/svg%3E">
<style>
  .s-controls { background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; }
  .s-controls h4 { font-size:13px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.1em; margin-bottom:10px; }
  .slider-row { margin-bottom:14px; }
  .slider-row label { display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; }
  .slider-row label .v { font-family:var(--font-mono); font-weight:700; color:var(--primary-dark); }
  .slider-row input[type="range"] { width:100%; }
  .estimates { background:var(--primary-light); border-radius:10px; padding:12px; margin-top:8px; }
  .estimates .row { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; }
  .estimates .row strong { color:var(--primary-dark); font-family:var(--font-mono); }
  .truss-presets { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; }
  .truss-preset { padding:8px 4px; text-align:center; font-size:11px; border-radius:6px; background:#f1f5f9; cursor:pointer; }
  .truss-preset.active { background:#1D4ED8; color:#fff; font-weight:700; }
</style>
</head>
<body data-tool="structure-sim" class="struct-theme">
<header class="topbar"><div class="brand"><span class="logo">🏛</span><div><h1>結構模擬器</h1><p class="subtitle">生活科技互動教學平台</p></div></div><a href="../index.html" class="module-back">← 回首頁</a></header>
<main class="module-page">
  <div class="module-header"><div><span class="module-step" style="background:var(--success-light);color:#1b6e3a">MODULE 04 ・ 核心</span><h2>桁架受力模擬器</h2><p class="muted">選一個桁架型式，施加荷重，看每根桿的受力（紅張藍壓）與節點變形。</p></div></div>

  <div class="practice-layout">
    <div class="struct-canvas-wrap">
      <canvas id="struct-canvas" width="760" height="500"></canvas>
      <div class="sim-controls">
        <button class="btn btn-primary" id="btn-load">▶ 施加荷重</button>
        <button class="btn btn-ghost" id="btn-reset">↺ 重置</button>
      </div>
    </div>

    <div class="sim-side">
      <div class="s-controls">
        <h4>桁架型式</h4>
        <div class="truss-presets">
          <div class="truss-preset active" data-type="pratt">Pratt</div>
          <div class="truss-preset" data-type="warren">Warren</div>
          <div class="truss-preset" data-type="howe">Howe</div>
        </div>
        <div class="slider-row" style="margin-top:14px">
          <label>跨距 <span class="v" id="v-span">400 px</span></label>
          <input type="range" id="s-span" min="200" max="600" step="20" value="400">
        </div>
        <div class="slider-row">
          <label>高度 <span class="v" id="v-height">120 px</span></label>
          <input type="range" id="s-height" min="60" max="200" step="10" value="120">
        </div>
        <div class="slider-row">
          <label>荷重大小 <span class="v" id="v-load">100 N</span></label>
          <input type="range" id="s-load" min="10" max="500" step="10" value="100">
        </div>
        <div class="slider-row">
          <label>荷重位置 <span class="v" id="v-pos">中央</span></label>
          <input type="range" id="s-pos" min="0" max="100" step="10" value="50">
        </div>
        <div class="estimates">
          <div class="row"><span>最大張力</span><strong id="e-tens">—</strong></div>
          <div class="row"><span>最大壓力</span><strong id="e-comp">—</strong></div>
          <div class="row"><span>支承反力</span><strong id="e-react">—</strong></div>
          <div class="row"><span>最大撓度</span><strong id="e-defl">—</strong></div>
        </div>
        <div id="verdict" class="verdict warn">點「施加荷重」看結果</div>
      </div>

      <div class="help-card">
        <strong>💡 桁架型式比較</strong>
        <ul>
          <li>Pratt：豎桿受壓、斜桿受張（常用鋼橋）</li>
          <li>Warren：交替張壓，桿件最少</li>
          <li>Howe：豎桿受張、斜桿受壓（適合木造）</li>
          <li>顏色：<span style="color:#dc2626">紅=張力</span> <span style="color:#1E40AF">藍=壓力</span></li>
        </ul>
      </div>
    </div>
  </div>

  <div class="module-nav-bottom"><a href="module3.html" class="btn btn-ghost">← 上一關</a><a href="module5.html" class="btn btn-primary">下一關：結構挑戰 →</a></div>
</main>
<script src="../../js/main.js"></script><script src="../../js/sources.js"></script><script src="../../js/audio.js"></script><script src="../js/module4.js"></script>
</body></html>
