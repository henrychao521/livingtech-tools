<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模組 1：認識線鋸機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🪚%3C/text%3E%3C/svg%3E">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">🪚</span>
    <div>
      <h1>數位線鋸機</h1>
      <p class="subtitle">生活科技互動教學平台</p>
    </div>
  </div>
  <a href="../index.html" class="module-back">← 回首頁</a>
</header>

<main class="module-page">
  <div class="module-header">
    <div>
      <span class="module-step">MODULE 01</span>
      <h2>認識線鋸機</h2>
      <p class="muted">從三種視角認識線鋸機：平面圖解、3D 立體模型、實物照片。</p>
    </div>
    <div class="muted" id="progress-text">已認識 0 / 8 個部位</div>
  </div>

  <!-- 視角切換 -->
  <div class="view-tabs" role="tablist">
    <button class="view-tab active" data-view="svg" role="tab">
      <span class="tab-icon">📐</span>
      <span class="tab-label">平面圖解</span>
      <span class="tab-desc">標示熱點</span>
    </button>
    <button class="view-tab" data-view="3d" role="tab">
      <span class="tab-icon">🎲</span>
      <span class="tab-label">3D 視角</span>
      <span class="tab-desc">可旋轉縮放</span>
    </button>
    <button class="view-tab" data-view="photo" role="tab">
      <span class="tab-icon">📷</span>
      <span class="tab-label">實物照片</span>
      <span class="tab-desc">真實機台</span>
    </button>
  </div>

  <div class="parts-layout">
    <div class="view-stage">
      <!-- View 1: SVG 平面圖 -->
      <div class="view-pane active" data-pane="svg">
        <div class="saw-stage">
          <svg viewBox="0 0 600 540" class="saw-svg" id="saw-svg">
            <defs>
              <linearGradient id="m1-bodyG" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="#FFAA55"/>
                <stop offset=".5" stop-color="#FF7A00"/>
                <stop offset="1" stop-color="#D85F00"/>
              </linearGradient>
              <linearGradient id="m1-armG" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="#FF9933"/>
                <stop offset="1" stop-color="#E66A00"/>
              </linearGradient>
              <linearGradient id="m1-tableG" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="#f0f0f0"/>
                <stop offset="1" stop-color="#b0b0b0"/>
              </linearGradient>
              <linearGradient id="m1-baseG" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="#4a4a4a"/>
                <stop offset="1" stop-color="#1a1a1a"/>
              </linearGradient>
              <linearGradient id="m1-bladeG" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#888"/>
                <stop offset=".5" stop-color="#fff"/>
                <stop offset="1" stop-color="#333"/>
              </linearGradient>
              <radialGradient id="m1-shadowG">
                <stop offset="0" stop-color="rgba(0,0,0,.35)"/>
                <stop offset="1" stop-color="rgba(0,0,0,0)"/>
              </radialGradient>
              <filter id="m1-softShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
                <feOffset dx="0" dy="8" result="offsetblur"/>
                <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
                <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <ellipse cx="300" cy="500" rx="220" ry="18" fill="url(#m1-shadowG)"/>

            <g filter="url(#m1-softShadow)">
              <rect x="100" y="430" width="400" height="64" rx="10" fill="url(#m1-baseG)"/>
              <rect x="120" y="422" width="360" height="14" fill="#0d0d0d"/>
              <g fill="#0d0d0d" opacity=".6">
                <rect x="140" y="448" width="60" height="3" rx="1"/>
                <rect x="140" y="455" width="60" height="3" rx="1"/>
                <rect x="140" y="462" width="60" height="3" rx="1"/>
                <rect x="140" y="469" width="60" height="3" rx="1"/>
                <rect x="140" y="476" width="60" height="3" rx="1"/>
              </g>
              <rect x="240" y="450" width="120" height="28" rx="3" fill="#0d0d0d"/>
              <text x="300" y="468" text-anchor="middle" fill="#FF7A00" font-size="13" font-weight="700" font-family="Inter, sans-serif">SCROLL SAW</text>
              <text x="300" y="478" text-anchor="middle" fill="#888" font-size="7" font-family="Inter, sans-serif">MODEL HL-2024</text>
            </g>

            <rect x="135" y="370" width="330" height="64" fill="rgba(0,0,0,.05)" rx="6"/>
            <g>
              <rect x="135" y="365" width="330" height="60" rx="6" fill="url(#m1-tableG)" stroke="#888" stroke-width="1"/>
              <rect x="135" y="363" width="330" height="8" fill="#a0a0a0"/>
              <line x1="298" y1="365" x2="298" y2="425" stroke="#444" stroke-width="3"/>
              <line x1="302" y1="365" x2="302" y2="425" stroke="#444" stroke-width="3"/>
              <g stroke="#666" stroke-width=".5" fill="none">
                <path d="M340 405 A 24 24 0 0 1 364 381"/>
                <path d="M350 405 A 34 34 0 0 1 374 371"/>
              </g>
              <text x="370" y="378" font-size="8" fill="#666" font-family="Inter,sans-serif">45°</text>
              <text x="345" y="395" font-size="7" fill="#666" font-family="Inter,sans-serif">22°</text>
              <text x="335" y="412" font-size="7" fill="#666" font-family="Inter,sans-serif">0°</text>
            </g>

            <g filter="url(#m1-softShadow)">
              <rect x="170" y="225" width="260" height="145" rx="10" fill="url(#m1-bodyG)"/>
              <rect x="180" y="232" width="40" height="120" rx="6" fill="rgba(255,255,255,.15)"/>
              <circle cx="180" cy="240" r="3" fill="#222"/>
              <circle cx="420" cy="240" r="3" fill="#222"/>
              <circle cx="180" cy="360" r="3" fill="#222"/>
              <circle cx="420" cy="360" r="3" fill="#222"/>
              <rect x="350" y="260" width="68" height="100" rx="5" fill="#1a1a1a"/>
              <circle cx="384" cy="285" r="18" fill="#fff" stroke="#0d0d0d" stroke-width="2"/>
              <circle cx="384" cy="285" r="13" fill="#f0f0f0"/>
              <line x1="384" y1="285" x2="384" y2="272" stroke="#222" stroke-width="3" stroke-linecap="round"/>
              <text x="384" y="312" text-anchor="middle" font-size="7" fill="#888" font-family="Inter,sans-serif">SPEED</text>
              <rect x="364" y="318" width="40" height="14" rx="2" fill="#0a2a0a"/>
              <text x="384" y="328" text-anchor="middle" fill="#3aff6a" font-size="9" font-family="monospace" font-weight="700">800</text>
              <rect x="364" y="338" width="18" height="16" rx="3" fill="#2EBD66"/>
              <rect x="386" y="338" width="18" height="16" rx="3" fill="#7a1a1a"/>
              <text x="373" y="349" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">ON</text>
              <text x="395" y="349" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">OFF</text>
            </g>

            <g filter="url(#m1-softShadow)">
              <path d="M170 145 Q300 95 430 145 L430 225 L370 235 L230 235 L170 225 Z" fill="url(#m1-armG)"/>
              <path d="M200 170 Q300 145 400 170" fill="none" stroke="rgba(0,0,0,.15)" stroke-width="1"/>
              <ellipse cx="300" cy="170" rx="42" ry="18" fill="rgba(255,255,255,.18)"/>
              <text x="300" y="175" text-anchor="middle" fill="#fff" font-size="13" font-weight="900" letter-spacing="3" font-family="Inter,sans-serif">HANLIN</text>
            </g>

            <g>
              <rect x="297" y="235" width="6" height="130" fill="#1a1a1a"/>
              <rect x="298" y="235" width="4" height="130" fill="url(#m1-bladeG)" opacity=".5"/>
              <line x1="300" y1="235" x2="300" y2="365" stroke="#fff" stroke-width=".7" stroke-dasharray="2 2"/>
              <g fill="#222">
                <polygon points="297,250 295,253 297,256"/>
                <polygon points="297,265 295,268 297,271"/>
                <polygon points="297,280 295,283 297,286"/>
                <polygon points="297,295 295,298 297,301"/>
                <polygon points="297,310 295,313 297,316"/>
                <polygon points="297,325 295,328 297,331"/>
                <polygon points="297,340 295,343 297,346"/>
              </g>
            </g>

            <g>
              <rect x="280" y="220" width="40" height="20" rx="3" fill="#1a1a1a"/>
              <rect x="282" y="222" width="36" height="4" fill="#666"/>
              <circle cx="288" cy="232" r="3" fill="#888"/>
              <circle cx="312" cy="232" r="3" fill="#888"/>
            </g>

            <g>
              <rect x="280" y="365" width="40" height="20" rx="3" fill="#1a1a1a"/>
              <circle cx="288" cy="375" r="3" fill="#666"/>
              <circle cx="312" cy="375" r="3" fill="#666"/>
            </g>

            <g>
              <line x1="225" y1="245" x2="195" y2="225" stroke="#666" stroke-width="4" stroke-linecap="round"/>
              <rect x="225" y="240" width="60" height="6" fill="#888" rx="2"/>
              <rect x="245" y="246" width="40" height="8" fill="#aaa" rx="2"/>
              <rect x="262" y="254" width="6" height="38" fill="#888"/>
              <rect x="252" y="290" width="26" height="10" rx="3" fill="#666"/>
              <rect x="254" y="298" width="22" height="3" rx="1" fill="#444"/>
            </g>

            <path d="M350 260 Q 335 285 318 295 Q 308 300 304 305" stroke="#444" stroke-width="4" fill="none" stroke-linecap="round"/>
            <circle cx="304" cy="305" r="3.5" fill="#1a1a1a"/>
            <g opacity=".5">
              <line x1="296" y1="306" x2="290" y2="308" stroke="#888" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/>
              <line x1="294" y1="310" x2="286" y2="312" stroke="#888" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/>
            </g>

            <g opacity=".7">
              <circle cx="240" cy="380" r="1.5" fill="#FFB066"/>
              <circle cx="350" cy="382" r="1" fill="#FFB066"/>
              <circle cx="220" cy="385" r="1.2" fill="#D85F00"/>
              <circle cx="320" cy="385" r="1" fill="#FFB066"/>
              <circle cx="380" cy="380" r="1.2" fill="#FFB066"/>
              <circle cx="260" cy="388" r="1" fill="#D85F00"/>
            </g>

            <g id="hotspots">
              <g class="hotspot-group" data-id="blade">
                <circle class="hotspot-pulse" cx="300" cy="300" r="14"><animate attributeName="r" values="14;22;14" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle>
                <circle class="hotspot" cx="300" cy="300" r="14"/>
                <text class="hotspot-label" x="300" y="304">1</text>
              </g>
              <g class="hotspot-group" data-id="upper-chuck">
                <circle class="hotspot" cx="300" cy="230" r="14"/>
                <text class="hotspot-label" x="300" y="234">2</text>
              </g>
              <g class="hotspot-group" data-id="lower-chuck">
                <circle class="hotspot" cx="300" cy="375" r="14"/>
                <text class="hotspot-label" x="300" y="379">3</text>
              </g>
              <g class="hotspot-group" data-id="table">
                <circle class="hotspot" cx="200" cy="395" r="14"/>
                <text class="hotspot-label" x="200" y="399">4</text>
              </g>
              <g class="hotspot-group" data-id="hold-down">
                <circle class="hotspot" cx="265" cy="295" r="14"/>
                <text class="hotspot-label" x="265" y="299">5</text>
              </g>
              <g class="hotspot-group" data-id="blower">
                <circle class="hotspot" cx="320" cy="280" r="14"/>
                <text class="hotspot-label" x="320" y="284">6</text>
              </g>
              <g class="hotspot-group" data-id="speed">
                <circle class="hotspot" cx="384" cy="285" r="14"/>
                <text class="hotspot-label" x="384" y="289">7</text>
              </g>
              <g class="hotspot-group" data-id="switch">
                <circle class="hotspot" cx="384" cy="346" r="14"/>
                <text class="hotspot-label" x="384" y="350">8</text>
              </g>
            </g>
          </svg>
        </div>
      </div>

      <!-- View 2: 3D 視角 -->
      <div class="view-pane" data-pane="3d">
        <div class="three-stage" id="three-stage">
          <div class="three-loader" id="three-loader">
            <div class="loading-spinner"></div>
            <p style="margin-top:14px;color:#666">載入 3D 模型中…</p>
          </div>
          <div class="three-controls">
            <button class="three-btn" id="three-rotate-toggle" title="切換自動旋轉">
              <span id="three-rotate-icon">⏸</span> 自動旋轉
            </button>
            <button class="three-btn" id="three-reset-view" title="重置視角">
              ⟲ 重置視角
            </button>
            <button class="three-btn" id="three-blade-toggle" title="鋸條啟動">
              ▶ 啟動鋸條
            </button>
          </div>
          <div class="three-help">
            <strong>🖱️ 操作</strong>
            <ul>
              <li>左鍵拖曳：旋轉視角</li>
              <li>右鍵拖曳：平移</li>
              <li>滾輪：縮放</li>
              <li>點選部位：查看資訊</li>
            </ul>
          </div>
        </div>
      </div>

      <!-- View 3: 實物照片 -->
      <div class="view-pane" data-pane="photo">
        <div class="photo-grid" id="photo-grid"></div>
      </div>
    </div>

    <div class="parts-info" id="parts-info">
      <div class="empty">
        <div class="empty-icon">👆</div>
        <p style="font-size:16px;font-weight:600;margin-bottom:6px">點擊圖中的橘色數字</p>
        <p style="font-size:13px;opacity:.7">可切換上方標籤，從不同視角認識線鋸機</p>
      </div>
    </div>
  </div>

  <div class="parts-checklist" id="parts-checklist"></div>

  <div class="module-nav-bottom">
    <a href="../index.html" class="btn btn-ghost">← 回首頁</a>
    <a href="module2.html" class="btn btn-primary" id="next-btn" style="opacity:.4;pointer-events:none">下一關：安全規範 →</a>
  </div>
</main>

<script src="../../js/main.js"></script>
<script src="../../js/audio.js"></script>
<script src="../js/module1.js"></script>
<script type="module" src="../js/module1-3d.js"></script>
</body>
</html>
