<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模組 4：機構運動模擬器</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/svg-effects.css"><link rel="stylesheet" href="../css/mechanism.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎡%3C/text%3E%3C/svg%3E">
<style>
  .mech-controls { background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; }
  .mech-controls h4 { font-size:13px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.1em; margin-bottom:10px; }
  .slider-row { margin-bottom:14px; }
  .slider-row label { display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; }
  .slider-row label .v { font-family:var(--font-mono); font-weight:700; color:var(--primary-dark); }
  .slider-row input[type="range"] { width:100%; }
  .mech-tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:14px; }
  .mech-tab { padding:10px 6px; text-align:center; font-size:12px; border-radius:6px; background:#f1f5f9; cursor:pointer; font-weight:700; }
  .mech-tab.active { background:#14B8A6; color:#fff; }
</style>
</head>
<body class="mech-theme">
<header class="topbar"><div class="brand"><span class="logo">🎡</span><div><h1>機構運動</h1><p class="subtitle">生活科技互動教學平台</p></div></div><a href="../index.html" class="module-back">← 回首頁</a></header>
<main class="module-page">
  <div class="module-header"><div><span class="module-step" style="background:var(--success-light);color:#1b6e3a">MODULE 04 ・ 核心</span><h2>機構運動模擬器</h2><p class="muted">調整機構參數，看實時運動曲線。</p></div></div>

  <div class="practice-layout">
    <div class="mech-canvas-wrap">
      <canvas id="mech-canvas" width="760" height="500"></canvas>
    </div>

    <div class="sim-side">
      <div class="mech-controls">
        <div class="mech-tabs">
          <div class="mech-tab active" data-m="crank">曲柄滑塊</div>
          <div class="mech-tab" data-m="cam">凸輪</div>
          <div class="mech-tab" data-m="gear">齒輪組</div>
        </div>

        <div id="crank-controls">
          <div class="slider-row">
            <label>曲柄半徑 R <span class="v" id="v-r">60 px</span></label>
            <input type="range" id="s-r" min="20" max="100" step="2" value="60">
          </div>
          <div class="slider-row">
            <label>連桿長度 L <span class="v" id="v-l">160 px</span></label>
            <input type="range" id="s-l" min="100" max="240" step="4" value="160">
          </div>
          <div class="slider-row">
            <label>轉速 <span class="v" id="v-speed">中</span></label>
            <input type="range" id="s-speed" min="1" max="5" step="1" value="3">
          </div>
        </div>

        <div id="cam-controls" style="display:none">
          <div class="slider-row">
            <label>凸輪偏心率 <span class="v" id="v-ecc">0.5</span></label>
            <input type="range" id="s-ecc" min="0.1" max="0.9" step="0.05" value="0.5">
          </div>
          <div class="slider-row">
            <label>凸輪轉速 <span class="v" id="v-cspeed">中</span></label>
            <input type="range" id="s-cspeed" min="1" max="5" step="1" value="3">
          </div>
        </div>

        <div id="gear-controls" style="display:none">
          <div class="slider-row">
            <label>大齒輪齒數 <span class="v" id="v-n1">24</span></label>
            <input type="range" id="s-n1" min="12" max="48" step="2" value="24">
          </div>
          <div class="slider-row">
            <label>小齒輪齒數 <span class="v" id="v-n2">12</span></label>
            <input type="range" id="s-n2" min="6" max="24" step="2" value="12">
          </div>
        </div>

        <div style="background:var(--primary-light);border-radius:10px;padding:12px;margin-top:8px;font-size:13px">
          <div id="info">運動類型：圓周 → 直線往復</div>
          <div id="info2" style="margin-top:4px;font-family:var(--font-mono);font-weight:700;color:#0F766E"></div>
        </div>
      </div>

      <div class="help-card">
        <strong>💡 觀察重點</strong>
        <ul>
          <li>R 越大 = 滑塊行程越大</li>
          <li>L 越長 = 運動越接近正弦波</li>
          <li>L 太短會卡死（必須 L > R）</li>
          <li>齒輪比 = N1 / N2 = 速度比反比</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="module-nav-bottom"><a href="module3.html" class="btn btn-ghost">← 上一關</a><a href="module5.html" class="btn btn-primary">下一關 →</a></div>
</main>
<script src="../../js/main.js"></script><script src="../../js/audio.js"></script><script src="../js/module4.js"></script>
</body></html>
