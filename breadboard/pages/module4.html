<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模組 4：電路組裝模擬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/svg-effects.css">
<link rel="stylesheet" href="../css/breadboard.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔌%3C/text%3E%3C/svg%3E">
</head>
<body class="breadboard-theme">
<header class="topbar">
  <div class="brand">
    <span class="logo">🔌</span>
    <div>
      <h1>數位麵包板電路</h1>
      <p class="subtitle">生活科技互動教學平台</p>
    </div>
  </div>
  <a href="../index.html" class="module-back">← 回首頁</a>
</header>

<main class="module-page">
  <div class="module-header">
    <div>
      <span class="module-step" style="background:var(--success-light);color:#1b6e3a">MODULE 04 ・ 核心</span>
      <h2>電路找錯與修正</h2>
      <p class="muted">每一關有一個故障電路。觀察、診斷、點擊修正讓 LED 亮起。</p>
    </div>
    <div class="muted" style="font-family:Inter,sans-serif">關卡：<span id="level-display" style="font-weight:700">L1</span></div>
  </div>

  <div class="practice-layout">
    <div class="bb-canvas-wrap">
      <canvas id="bb-canvas" width="760" height="500"></canvas>
      <div class="sim-overlay" id="sim-overlay">點擊紅圈處修正錯誤，再按「通電測試」</div>
      <div class="sim-controls">
        <button class="btn btn-primary" id="btn-power">⚡ 通電測試</button>
        <button class="btn btn-ghost" id="btn-reset">↺ 重置</button>
      </div>
    </div>

    <div class="sim-side">
      <div class="bb-goal" id="goal-card">
        <h4>🎯 關卡目標</h4>
        <p id="goal-text">讓 LED 點亮（綠燈）</p>
      </div>

      <div class="level-list">
        <h4>關卡選單</h4>
        <button class="level-btn active" data-lvl="L1">
          <span>L1 加入電阻</span>
          <span class="stars" id="star-L1">☆☆☆</span>
        </button>
        <button class="level-btn" data-lvl="L2">
          <span>L2 修正 LED 方向</span>
          <span class="stars" id="star-L2">☆☆☆</span>
        </button>
        <button class="level-btn" data-lvl="L3">
          <span>L3 跨接電源軌</span>
          <span class="stars" id="star-L3">☆☆☆</span>
        </button>
        <button class="level-btn" data-lvl="L4">
          <span>L4 並聯兩顆 LED</span>
          <span class="stars" id="star-L4">☆☆☆</span>
        </button>
        <button class="level-btn" data-lvl="L5">
          <span>L5 加入開關</span>
          <span class="stars" id="star-L5">☆☆☆</span>
        </button>
      </div>

      <div class="help-card">
        <strong>💡 提示</strong>
        <ul>
          <li>紅圈：可點擊修正</li>
          <li>綠線：電流流向</li>
          <li>LED 亮起 = 過關</li>
          <li>冒煙 = 短路 / 沒電阻</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="module-nav-bottom">
    <a href="module3.html" class="btn btn-ghost">← 上一關</a>
    <a href="module5.html" class="btn btn-primary">下一關：故障圖鑑 →</a>
  </div>
</main>

<div class="result-modal" id="result-modal">
  <div class="result-card">
    <h2 id="r-title">電路完成！</h2>
    <div class="result-stars" id="r-stars">★★★</div>
    <div class="result-detail" id="r-detail"></div>
    <div class="result-actions">
      <button class="btn btn-ghost" id="r-retry">重做一次</button>
      <button class="btn btn-primary" id="r-next">下一關</button>
    </div>
  </div>
</div>

<script src="../../js/main.js"></script>
<script src="../../js/audio.js"></script>
<script src="../js/module4.js"></script>
</body>
</html>
