<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模組 4：模擬焊接練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/svg-effects.css">
<link rel="stylesheet" href="../css/solder.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔥%3C/text%3E%3C/svg%3E">
</head>
<body data-tool="solder" class="solder-theme">
<header class="topbar">
  <div class="brand">
    <span class="logo">🔥</span>
    <div>
      <h1>數位電烙鐵</h1>
      <p class="subtitle">生活科技互動教學平台</p>
    </div>
  </div>
  <a href="../index.html" class="module-back">← 回首頁</a>
</header>

<main class="module-page">
  <div class="module-header">
    <div>
      <span class="module-step" style="background:var(--success-light);color:#1b6e3a">MODULE 04 ・ 核心</span>
      <h2>模擬焊接練習</h2>
      <p class="muted">移動烙鐵到接點上，按住空白鍵或滑鼠左鍵送錫。注意停留時間：太短虛焊、太長燒板。</p>
    </div>
    <div class="muted" style="font-family:Inter,sans-serif">關卡：<span id="level-display" style="font-weight:700">L1</span></div>
  </div>

  <div class="practice-layout">
    <div class="solder-canvas-wrap">
      <canvas id="solder-canvas" width="760" height="500"></canvas>
      <div class="sim-overlay" id="sim-overlay">移動烙鐵到接點　|　空白鍵送錫</div>
      <div class="sim-controls">
        <button class="btn btn-primary" id="btn-start">▶ 開始焊接</button>
        <button class="btn btn-ghost" id="btn-reset">↺ 重置</button>
        <button class="btn btn-ghost" id="btn-finish">✓ 提交評分</button>
      </div>
    </div>

    <div class="sim-side">
      <div class="iron-status">
        <div class="temp-display heating" id="temp-display">25°C</div>
        <div class="row"><span class="label">設定溫度</span><span class="value">350°C</span></div>
        <div class="row"><span class="label">當前狀態</span><span class="value" id="iron-state">加熱中</span></div>
        <div class="row"><span class="label">焊點完成</span><span class="value" id="joint-count">0 / —</span></div>
      </div>

      <div class="level-list">
        <h4>關卡選單</h4>
        <button class="level-btn active" data-lvl="L1">
          <span>L1 單點焊接</span>
          <span class="stars" id="star-L1">☆☆☆</span>
        </button>
        <button class="level-btn" data-lvl="L2">
          <span>L2 多點直線（3 點）</span>
          <span class="stars" id="star-L2">☆☆☆</span>
        </button>
        <button class="level-btn" data-lvl="L3">
          <span>L3 排針焊接（5 點）</span>
          <span class="stars" id="star-L3">☆☆☆</span>
        </button>
        <button class="level-btn" data-lvl="L4">
          <span>L4 SMD 微焊（4 點）</span>
          <span class="stars" id="star-L4">☆☆☆</span>
        </button>
        <button class="level-btn" data-lvl="L5">
          <span>L5 修正錯誤焊</span>
          <span class="stars" id="star-L5">☆☆☆</span>
        </button>
      </div>

      <div class="help-card">
        <strong>📖 操作說明</strong>
        <ul>
          <li>滑鼠移動：控制烙鐵位置</li>
          <li>烙鐵碰到接點：開始加熱</li>
          <li>加熱 1.5 秒後送錫</li>
          <li>按住「空白鍵」或滑鼠左鍵送錫</li>
          <li>放開後再停 0.5 秒移開</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="module-nav-bottom">
    <a href="module3.html" class="btn btn-ghost">← 上一關</a>
    <a href="module5.html" class="btn btn-primary">下一關：焊點鑑定 →</a>
  </div>
</main>

<div class="result-modal" id="result-modal">
  <div class="result-card">
    <h2 id="r-title">焊接完成！</h2>
    <div class="result-stars" id="r-stars">★★★</div>
    <div class="result-detail" id="r-detail"></div>
    <div class="result-actions">
      <button class="btn btn-ghost" id="r-retry">再挑戰一次</button>
      <button class="btn btn-primary" id="r-next">下一關</button>
    </div>
  </div>
</div>

<script src="../../js/main.js"></script><script src="../../js/sources.js"></script>
<script src="../../js/audio.js"></script>
<script src="../js/module4.js"></script>
</body>
</html>
