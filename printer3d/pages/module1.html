<body class="printer-theme">
<header class="topbar">
  <div class="brand"><span class="logo">🖨️</span><div><h1>數位 3D 印表機</h1><p class="subtitle">生活科技互動教學平台</p></div></div>

<main class="module-page">
  <div class="module-header">
    <div><span class="module-step">MODULE 01</span><h2>認識 3D 印表機</h2><p class="muted">點擊圖中橘色標記，認識每個部件的功能。</p></div>
    <div class="muted" id="progress-text">已認識 0 / 8 個部件</div>
  </div>
  <div class="parts-layout">
    <div class="saw-stage">
      <svg viewBox="0 0 600 540" class="saw-svg svg-shadow-soft">
        <defs>
          <linearGradient id="m1pFrame" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#1e293b"/>
            <stop offset=".4" stop-color="#475569"/>
            <stop offset=".5" stop-color="#64748b"/>
            <stop offset=".6" stop-color="#475569"/>
            <stop offset="1" stop-color="#1e293b"/>
          </linearGradient>
          <linearGradient id="m1pBed" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#dc2626"/>
            <stop offset=".5" stop-color="#b91c1c"/>
            <stop offset="1" stop-color="#7f1d1d"/>
          </linearGradient>
          <linearGradient id="m1pBedTop" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#fef2f2"/>
            <stop offset=".5" stop-color="#fecaca"/>
            <stop offset="1" stop-color="#dc2626"/>
          </linearGradient>
          <linearGradient id="m1pSpool" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#67e8f9"/>
            <stop offset="1" stop-color="#0891B2"/>
          </linearGradient>
          <radialGradient id="m1pHeatGlow" cx=".5" cy=".5">
            <stop offset="0" stop-color="rgba(255,100,0,.55)"/>
            <stop offset="1" stop-color="rgba(255,100,0,0)"/>
          </radialGradient>
          <filter id="m1pShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="4"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- 影子 -->
        <ellipse cx="300" cy="510" rx="240" ry="16" fill="rgba(0,0,0,.18)"/>

        <!-- 底座電源 -->
        <g filter="url(#m1pShadow)">
          <rect x="60" y="425" width="480" height="60" rx="6" fill="#1e293b"/>
          <rect x="60" y="420" width="480" height="8" fill="#0f172a"/>
          <!-- 散熱孔 -->
          <g fill="#0a0f1c">
            <rect x="80" y="440" width="60" height="3" rx="1"/>
            <rect x="80" y="447" width="60" height="3" rx="1"/>
            <rect x="80" y="454" width="60" height="3" rx="1"/>
            <rect x="80" y="461" width="60" height="3" rx="1"/>
            <rect x="80" y="468" width="60" height="3" rx="1"/>
          </g>
          <!-- LCD 控制面板 -->
          <rect x="360" y="438" width="150" height="38" rx="4" fill="#0a2a0a" stroke="#3aff6a" stroke-width="1"/>
          <text x="435" y="455" text-anchor="middle" fill="#3aff6a" font-size="11" font-family="monospace" font-weight="700">PRINTING 45%</text>
          <text x="435" y="470" text-anchor="middle" fill="#3aff6a" font-size="9" font-family="monospace">Layer 78/240  T:200°C</text>
          <!-- SD 卡槽 -->
          <rect x="245" y="440" width="36" height="22" rx="2" fill="#0f172a"/>
          <rect x="248" y="443" width="30" height="3" fill="#64748b"/>
          <text x="263" y="455" text-anchor="middle" fill="#64748b" font-size="8" font-family="Inter">SD</text>
          <!-- 按鈕轉鈕 -->
          <circle cx="305" cy="452" r="11" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
          <circle cx="305" cy="452" r="3" fill="#fbbf24"/>
        </g>

        <!-- Z 軸框架（鋁擠型）含螺絲孔 -->
        <g filter="url(#m1pShadow)">
          <rect x="80" y="60" width="26" height="370" rx="2" fill="url(#m1pFrame)"/>
          <rect x="494" y="60" width="26" height="370" rx="2" fill="url(#m1pFrame)"/>
          <!-- 鋁擠型槽紋 -->
          <line x1="93" y1="60" x2="93" y2="430" stroke="#0f172a" stroke-width="1"/>
          <line x1="507" y1="60" x2="507" y2="430" stroke="#0f172a" stroke-width="1"/>
          <!-- 螺絲孔 -->
          <circle cx="93" cy="75" r="3" fill="#0f172a"/>
          <circle cx="93" cy="420" r="3" fill="#0f172a"/>
          <circle cx="507" cy="75" r="3" fill="#0f172a"/>
          <circle cx="507" cy="420" r="3" fill="#0f172a"/>
          <!-- 上橫樑 -->
          <rect x="80" y="60" width="440" height="26" rx="2" fill="url(#m1pFrame)"/>
          <line x1="80" y1="73" x2="520" y2="73" stroke="#0f172a" stroke-width="1"/>
        </g>

        <!-- Z 軸絲桿（左右各一）+ 平滑桿 -->
        <line x1="100" y1="86" x2="100" y2="425" stroke="#94a3b8" stroke-width="3.5"/>
        <!-- 絲桿螺紋 -->
        <g stroke="#475569" stroke-width="0.8">
          <line x1="97" y1="100" x2="103" y2="105"/>
          <line x1="97" y1="115" x2="103" y2="120"/>
          <line x1="97" y1="130" x2="103" y2="135"/>
          <line x1="97" y1="145" x2="103" y2="150"/>
          <line x1="97" y1="160" x2="103" y2="165"/>
          <line x1="97" y1="175" x2="103" y2="180"/>
          <line x1="97" y1="190" x2="103" y2="195"/>
          <line x1="97" y1="205" x2="103" y2="210"/>
          <line x1="97" y1="220" x2="103" y2="225"/>
          <line x1="97" y1="235" x2="103" y2="240"/>
        </g>
        <line x1="500" y1="86" x2="500" y2="425" stroke="#94a3b8" stroke-width="3.5"/>
        <g stroke="#475569" stroke-width="0.8">
          <line x1="497" y1="100" x2="503" y2="105"/>
          <line x1="497" y1="130" x2="503" y2="135"/>
          <line x1="497" y1="160" x2="503" y2="165"/>
          <line x1="497" y1="190" x2="503" y2="195"/>
          <line x1="497" y1="220" x2="503" y2="240"/>
        </g>
        <!-- 平滑桿（線性導軌）-->
        <line x1="125" y1="86" x2="125" y2="425" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="475" y1="86" x2="475" y2="425" stroke="#cbd5e1" stroke-width="2"/>

        <!-- X 軸樑（含時規帶溝紋） -->
        <g filter="url(#m1pShadow)">
          <rect x="100" y="172" width="400" height="22" rx="3" fill="#475569"/>
          <line x1="100" y1="180" x2="500" y2="180" stroke="#1e293b" stroke-width="0.5"/>
          <line x1="100" y1="186" x2="500" y2="186" stroke="#1e293b" stroke-width="0.5"/>
          <!-- 時規帶（GT2）-->
          <g stroke="#0f172a" stroke-width="1">
            <line x1="110" y1="195" x2="490" y2="195"/>
          </g>
          <g fill="#1e293b">
            <rect x="115" y="194" width="2" height="4"/>
            <rect x="125" y="194" width="2" height="4"/>
            <rect x="135" y="194" width="2" height="4"/>
            <rect x="145" y="194" width="2" height="4"/>
            <rect x="155" y="194" width="2" height="4"/>
            <rect x="165" y="194" width="2" height="4"/>
            <rect x="175" y="194" width="2" height="4"/>
            <rect x="185" y="194" width="2" height="4"/>
            <rect x="195" y="194" width="2" height="4"/>
            <rect x="205" y="194" width="2" height="4"/>
            <rect x="215" y="194" width="2" height="4"/>
            <rect x="225" y="194" width="2" height="4"/>
            <rect x="235" y="194" width="2" height="4"/>
            <rect x="245" y="194" width="2" height="4"/>
            <rect x="255" y="194" width="2" height="4"/>
            <rect x="265" y="194" width="2" height="4"/>
            <rect x="275" y="194" width="2" height="4"/>
            <rect x="285" y="194" width="2" height="4"/>
            <rect x="295" y="194" width="2" height="4"/>
            <rect x="305" y="194" width="2" height="4"/>
            <rect x="315" y="194" width="2" height="4"/>
            <rect x="325" y="194" width="2" height="4"/>
            <rect x="335" y="194" width="2" height="4"/>
            <rect x="345" y="194" width="2" height="4"/>
            <rect x="355" y="194" width="2" height="4"/>
            <rect x="365" y="194" width="2" height="4"/>
            <rect x="375" y="194" width="2" height="4"/>
            <rect x="385" y="194" width="2" height="4"/>
          </g>
        </g>

        <!-- 步進馬達（左右兩端的 NEMA17）-->
        <g filter="url(#m1pShadow)">
          <rect x="60" y="170" width="40" height="40" rx="3" fill="#1e293b"/>
          <circle cx="80" cy="190" r="14" fill="#0f172a"/>
          <circle cx="80" cy="190" r="6" fill="#fbbf24"/>
          <text x="80" y="194" text-anchor="middle" font-size="6" fill="#1e293b" font-weight="700" font-family="Inter">M</text>
        </g>
        <g filter="url(#m1pShadow)">
          <rect x="500" y="170" width="40" height="40" rx="3" fill="#1e293b"/>
          <circle cx="520" cy="190" r="14" fill="#0f172a"/>
          <circle cx="520" cy="190" r="6" fill="#fbbf24"/>
        </g>

        <!-- 噴頭組（hotend + 散熱風扇 + 噴嘴） -->
        <g transform="translate(290,196)" filter="url(#m1pShadow)">
          <!-- 散熱風扇外殼 -->
          <rect x="-36" y="0" width="72" height="44" rx="3" fill="#1e293b"/>
          <!-- 風扇蓋 -->
          <circle cx="-22" cy="22" r="14" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
          <g stroke="#64748b" stroke-width="1" fill="none">
            <path d="M -22 11 Q -16 18 -22 22"/>
            <path d="M -33 22 Q -26 16 -22 22"/>
            <path d="M -22 33 Q -28 26 -22 22"/>
            <path d="M -11 22 Q -18 28 -22 22"/>
          </g>
          <!-- Hotend 加熱塊 -->
          <rect x="-8" y="14" width="40" height="20" rx="1" fill="#dc2626"/>
          <rect x="-8" y="14" width="40" height="3" fill="#7f1d1d"/>
          <text x="12" y="28" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="Inter">200°C</text>
          <!-- 熱發光 -->
          <ellipse cx="12" cy="48" rx="34" ry="14" fill="url(#m1pHeatGlow)"/>
          <!-- 噴嘴 -->
          <polygon points="6,44 18,44 12,58" fill="#fbbf24"/>
          <polygon points="6,44 18,44 12,52" fill="#f59e0b"/>
          <circle cx="12" cy="58" r="2" fill="#0f172a"/>
        </g>

        <!-- 熱床（含已列印模型）-->
        <g filter="url(#m1pShadow)">
          <!-- 熱床側面 -->
          <rect x="120" y="380" width="360" height="42" rx="3" fill="url(#m1pBed)"/>
          <!-- 熱床上表面（玻璃 / PEI）-->
          <rect x="120" y="375" width="360" height="10" rx="2" fill="url(#m1pBedTop)" opacity=".85"/>
          <!-- 玻璃高光 -->
          <rect x="125" y="377" width="350" height="2" fill="rgba(255,255,255,.5)"/>
          <!-- 文字 -->
          <text x="300" y="408" text-anchor="middle" fill="#fef2f2" font-size="12" font-weight="700" font-family="Inter">HEATED BED 60°C</text>
          <!-- 已列印模型（圓柱杯子）-->
          <g transform="translate(280,344)">
            <!-- 由層線堆疊 -->
            <ellipse cx="0" cy="0" rx="22" ry="6" fill="#0891B2"/>
            <ellipse cx="0" cy="-3" rx="22" ry="6" fill="#06B6D4"/>
            <ellipse cx="0" cy="-6" rx="22" ry="6" fill="#22d3ee" opacity=".9"/>
            <ellipse cx="0" cy="-9" rx="22" ry="6" fill="#0891B2"/>
            <ellipse cx="0" cy="-12" rx="22" ry="6" fill="#06B6D4"/>
            <ellipse cx="0" cy="-15" rx="22" ry="6" fill="#22d3ee" opacity=".9"/>
            <ellipse cx="0" cy="-18" rx="22" ry="6" fill="#0891B2"/>
            <ellipse cx="0" cy="-21" rx="22" ry="6" fill="#06B6D4"/>
            <ellipse cx="0" cy="-24" rx="22" ry="6" fill="#22d3ee" opacity=".9"/>
            <ellipse cx="0" cy="-27" rx="22" ry="6" fill="#67e8f9"/>
            <text x="0" y="-15" text-anchor="middle" fill="#fff" font-size="8" font-weight="700" opacity=".7">PLA</text>
          </g>
        </g>

        <!-- 絲線卷（spool）-->
        <g transform="translate(555,260)" filter="url(#m1pShadow)">
          <!-- 卷盤外殼 -->
          <circle cx="0" cy="0" r="42" fill="url(#m1pSpool)" stroke="#0e7490" stroke-width="2"/>
          <!-- 中央軸 -->
          <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
          <circle cx="0" cy="0" r="4" fill="#0f172a"/>
          <!-- 絲線層次（圓圈）-->
          <circle cx="0" cy="0" r="38" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="0.5"/>
          <circle cx="0" cy="0" r="32" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="0.5"/>
          <circle cx="0" cy="0" r="26" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="0.5"/>
          <circle cx="0" cy="0" r="20" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="0.5"/>
          <!-- 標籤 -->
          <text x="0" y="3" text-anchor="middle" font-size="10" fill="#fff" font-weight="800" font-family="Inter">PLA</text>
          <text x="0" y="-22" text-anchor="middle" font-size="6" fill="#fff" opacity=".8">1.75mm</text>
        </g>

        <!-- 絲線從卷盤拉到擠出機（曲線） -->
        <path d="M 515 240 Q 480 200 200 175 Q 150 170 130 168" stroke="#06B6D4" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".85"/>

        <!-- 擠出機（左上角） -->
        <g transform="translate(130,168)" filter="url(#m1pShadow)">
          <!-- 馬達本體 -->
          <rect x="-22" y="-22" width="44" height="44" rx="3" fill="#1e293b"/>
          <!-- 齒輪 -->
          <circle cx="0" cy="0" r="11" fill="#fbbf24" stroke="#92400e" stroke-width="1"/>
          <g stroke="#92400e" stroke-width="0.8">
            <line x1="0" y1="-11" x2="0" y2="-13"/>
            <line x1="0" y1="11" x2="0" y2="13"/>
            <line x1="-11" y1="0" x2="-13" y2="0"/>
            <line x1="11" y1="0" x2="13" y2="0"/>
            <line x1="-8" y1="-8" x2="-9" y2="-9"/>
            <line x1="8" y1="-8" x2="9" y2="-9"/>
            <line x1="-8" y1="8" x2="-9" y2="9"/>
            <line x1="8" y1="8" x2="9" y2="9"/>
          </g>
          <circle cx="0" cy="0" r="3" fill="#0f172a"/>
          <text x="0" y="-26" text-anchor="middle" font-size="7" fill="#cbd5e1" font-family="Inter" font-weight="600">EXTRUDER</text>
        </g>

        <!-- 互動熱點 -->
        <g id="hotspots">
          <g class="hotspot-group" data-id="nozzle"><circle class="hotspot-pulse" cx="302" cy="254" r="14"><animate attributeName="r" values="14;22;14" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle><circle class="hotspot" cx="302" cy="254" r="14"/><text class="hotspot-label" x="302" y="258">1</text></g>
          <g class="hotspot-group" data-id="hotend"><circle class="hotspot" cx="302" cy="215" r="14"/><text class="hotspot-label" x="302" y="219">2</text></g>
          <g class="hotspot-group" data-id="bed"><circle class="hotspot" cx="160" cy="400" r="14"/><text class="hotspot-label" x="160" y="404">3</text></g>
          <g class="hotspot-group" data-id="x-axis"><circle class="hotspot" cx="200" cy="184" r="14"/><text class="hotspot-label" x="200" y="188">4</text></g>
          <g class="hotspot-group" data-id="z-axis"><circle class="hotspot" cx="500" cy="280" r="14"/><text class="hotspot-label" x="500" y="284">5</text></g>
          <g class="hotspot-group" data-id="extruder"><circle class="hotspot" cx="130" cy="168" r="14"/><text class="hotspot-label" x="130" y="172">6</text></g>
          <g class="hotspot-group" data-id="filament"><circle class="hotspot" cx="555" cy="218" r="14"/><text class="hotspot-label" x="555" y="222">7</text></g>
          <g class="hotspot-group" data-id="lcd"><circle class="hotspot" cx="435" cy="455" r="14"/><text class="hotspot-label" x="435" y="459">8</text></g>
        </g>
      </svg>
    </div>
    <div class="parts-info" id="parts-info">
      <div class="empty"><div class="empty-icon">👆</div><p style="font-size:16px;font-weight:600">點擊橘色數字</p><p style="font-size:13px;opacity:.7">8 個項目都認完才能進下一關</p></div>
    </div>
  </div>
