  <div class="module-header"><div><span class="module-step" style="background:var(--accent-light);color:#5b21b6">MODULE 03</span><h2>機械利益計算</h2><p class="muted">用公式算出每種簡單機械的省力倍數。</p></div><div class="muted" id="prog-text">已答 0/6 題</div></div>

  <section class="panel"><h3>核心公式</h3>
    <div style="background:#FCE7F3;padding:20px;border-radius:14px;font-size:18px;color:#9D174D;text-align:center">
      <div style="margin-bottom:8px">機械利益 (MA) = 抗力 (W) ÷ 施力 (F)</div>
      <div style="font-size:14px;color:#666">= 施力距離 ÷ 抗力距離（能量守恆）</div>
    </div>
    <p style="margin-top:14px;color:#666;font-size:13.5px">MA > 1 = 省力；MA < 1 = 費力。省力代價就是「施力要走更遠的距離」——能量永遠守恆。</p>
