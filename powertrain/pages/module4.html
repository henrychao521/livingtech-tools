<title>模組 4：動力效率模擬器</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚗%3C/text%3E%3C/svg%3E">
<style>.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:14px}.tab{padding:8px;text-align:center;font-size:11px;border-radius:6px;background:#f1f5f9;cursor:pointer;font-weight:700}.tab.active{background:#EA580C;color:#fff}.estimates{background:var(--primary-light);border-radius:10px;padding:12px;margin-top:8px}.estimates .row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}.estimates strong{color:#9A3412;font-family:var(--font-mono)}</style>
</head><body data-tool="powertrain" class="pt-theme">
<header class="topbar"><div class="brand"><span class="logo">🚗</span><div><h1>動力與運輸</h1><p class="subtitle">生活科技互動教學平台</p></div></div><a href="../index.html" class="module-back">← 回首頁</a></header>
<main class="module-page">
  <div class="module-header"><div><span class="module-step" style="background:var(--success-light);color:#1b6e3a">MODULE 04 ・ 核心</span><h2>動力效率模擬器</h2><p class="muted">4 種車輛 × 動力來源 × 行駛條件，看效率與碳排。</p></div></div>
  <section class="panel">
    <div class="tabs"><div class="tab active" data-c="sedan">🚗 房車</div><div class="tab" data-c="bus">🚌 巴士</div><div class="tab" data-c="truck">🚛 卡車</div><div class="tab" data-c="bike">🛵 機車</div></div>
    <div id="info" style="background:#fff;padding:16px;border-radius:10px;margin-bottom:12px"></div>
    <div style="background:#fff;padding:14px;border-radius:10px;margin-bottom:12px">
      <label style="display:flex;justify-content:space-between;font-size:13px">動力源
        <select id="s-power" style="font-size:13px;padding:2px 6px;border-radius:4px"><option value="ice">內燃機（汽油）</option><option value="diesel">內燃機（柴油）</option><option value="ev">電動 EV</option><option value="hybrid">油電混合</option><option value="fc">燃料電池</option></select></label>
    </div>
    <div style="background:#fff;padding:14px;border-radius:10px;margin-bottom:12px">
      <label style="font-size:13px">行駛距離（km）<input type="range" id="s-dist" min="10" max="500" step="10" value="100" style="width:100%"></label>
      <div style="text-align:right;font-family:var(--font-mono);font-weight:700;color:#9A3412" id="v-dist">100 km</div>
    </div>
    <div class="estimates">
      <div class="row"><span>整體效率</span><strong id="r-eff">—</strong></div>
      <div class="row"><span>燃料/電消耗</span><strong id="r-fuel">—</strong></div>
      <div class="row"><span>能源成本</span><strong id="r-cost">—</strong></div>
      <div class="row"><span>CO₂ 排放</span><strong id="r-co2">—</strong></div>
      <div class="row"><span>等同種樹</span><strong id="r-trees">—</strong></div>
    </div>
  </section>
  <div class="module-nav-bottom"><a href="module3.html" class="btn btn-ghost">← 上一關</a><a href="module5.html" class="btn btn-primary">下一關 →</a></div>
