</head><body data-tool="powertrain" class="pt-theme">
<header class="topbar"><div class="brand"><span class="logo">🚗</span><div><h1>動力與運輸</h1><p class="subtitle">生活科技互動教學平台</p></div></div><a href="../index.html" class="module-back">← 回首頁</a></header>
<main class="module-page">
  <div class="module-header"><div><span class="module-step">MODULE 01</span><h2>4 種動力系統</h2><p class="muted">點擊每張卡認識動力原理與應用。</p></div><div class="muted" id="prog">已認識 0 / 4 種</div></div>
  <!-- TRIPO-3D --><section class="panel">
    <h3>🔭 寫實 3D 動力系統(可旋轉) <span style="font-size:12px;font-weight:500;color:#64748b;margin-left:6px">點名稱切換 · 拖曳旋轉 · 滾輪縮放</span></h3>
    <p class="muted" style="margin-bottom:12px">AI 生成的示意模型,從各角度認識各動力系統的外形。</p>
    <div id="p3d-tabs" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
      <button type="button" class="p3d-btn" data-src="ice.glb">內燃機</button>
      <button type="button" class="p3d-btn" data-src="motor.glb">電動機</button>
      <button type="button" class="p3d-btn" data-src="fuelcell.glb">燃料電池</button>
      <button type="button" class="p3d-btn" data-src="hydraulic.glb">液壓動力</button>
    </div>
    <div style="background:#1e293b;border-radius:14px;overflow:hidden">
      <model-viewer id="p3d-viewer" src="../assets/models/ice.glb" loading="eager" camera-controls auto-rotate auto-rotate-delay="0" rotation-per-second="20deg" environment-image="neutral" shadow-intensity="1" style="width:100%;height:340px;--poster-color:#1e293b"></model-viewer>
    </div>
    <p class="muted" style="margin-top:8px;font-size:13px">💡 AI 生成的概念示意模型,呈現各動力系統的典型外形;實際結構與運作原理請以課本與下方說明為準。</p>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <script>
    (function(){
      var v=document.getElementById('p3d-viewer'),tabs=document.querySelectorAll('#p3d-tabs .p3d-btn');
      function sel(b){tabs.forEach(function(x){x.style.background=(x===b)?'#0ea5e9':'#e2e8f0';x.style.color=(x===b)?'#fff':'#0f172a';});}
      tabs.forEach(function(b){
        b.style.cssText='padding:6px 14px;border:none;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600';
        b.addEventListener('click',function(){v.setAttribute('src','../assets/models/'+b.dataset.src);sel(b);});
      });
      sel(tabs[0]);
    })();
    </script>
  </section>
  <section class="panel"><h3>主要動力系統</h3><div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px"></div></section>
