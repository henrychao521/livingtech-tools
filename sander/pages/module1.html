<body data-tool="sander" class="sander-theme">
<header class="topbar">
  <div class="brand"><span class="logo">✨</span><div><h1>數位砂磨機</h1><p class="subtitle">生活科技互動教學平台</p></div></div>
  <a href="../index.html" class="module-back">← 回首頁</a>
</header>
<main class="module-page">
  <div class="module-header">
    <div><span class="module-step">MODULE 01</span><h2>認識砂磨機</h2><p class="muted">點擊圖中紫色標記，認識每個部件的功能。</p></div>
    <div class="muted" id="progress-text">已認識 0 / 8 個部件</div>
  </div>
  <div class="parts-layout">
    <div class="saw-stage">
      <svg viewBox="0 0 680 540" class="saw-svg svg-shadow-soft">
        <defs>
          <linearGradient id="m1sBody" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#5B21B6"/></linearGradient>
          <linearGradient id="m1sMetal" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e5e7eb"/><stop offset=".5" stop-color="#9ca3af"/><stop offset="1" stop-color="#4b5563"/></linearGradient>
          <pattern id="m1sGrit" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
            <rect width="6" height="6" fill="#92400e"/>
            <circle cx="1" cy="2" r=".7" fill="#451a03"/>
            <circle cx="4" cy="1" r=".5" fill="#fbbf24"/>
            <circle cx="3" cy="4" r=".7" fill="#451a03"/>
          </pattern>
          <filter id="m1sShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dx="0" dy="4"/><feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <ellipse cx="340" cy="510" rx="280" ry="14" fill="rgba(0,0,0,.18)"/>

        <!-- 基座 -->
        <g filter="url(#m1sShadow)">
          <rect x="80" y="430" width="520" height="60" rx="6" fill="url(#m1sBody)"/>
          <rect x="80" y="424" width="520" height="8" fill="#5B21B6"/>
        </g>

        <!-- 帶式砂磨機 -->
        <g filter="url(#m1sShadow)">
          <circle cx="180" cy="260" r="60" fill="url(#m1sMetal)"/>
          <circle cx="180" cy="260" r="45" fill="#0f172a"/>
          <circle cx="180" cy="260" r="10" fill="#A78BFA"/>
          <circle cx="350" cy="260" r="60" fill="url(#m1sMetal)"/>
          <circle cx="350" cy="260" r="45" fill="#0f172a"/>
          <circle cx="350" cy="260" r="10" fill="#A78BFA"/>
          <!-- 砂帶 -->
          <path d="M 180 200 L 350 200 L 350 215 L 180 215 Z" fill="url(#m1sGrit)"/>
          <path d="M 180 305 L 350 305 L 350 320 L 180 320 Z" fill="url(#m1sGrit)"/>
          <!-- 方向箭頭 -->
          <polygon points="240,210 252,205 240,200" fill="#fff" opacity=".85"/>
          <polygon points="280,210 292,205 280,200" fill="#fff" opacity=".85"/>
          <!-- 工作面 + 靠尺 -->
          <rect x="180" y="185" width="170" height="8" fill="#5B21B6"/>
          <rect x="190" y="150" width="150" height="32" rx="3" fill="#5B21B6"/>
          <text x="265" y="170" text-anchor="middle" fill="#A78BFA" font-size="11" font-weight="800" font-family="Inter">FENCE 靠尺</text>
        </g>

        <!-- 盤式砂磨機 -->
        <g filter="url(#m1sShadow)">
          <circle cx="520" cy="270" r="80" fill="url(#m1sGrit)"/>
          <circle cx="520" cy="270" r="80" fill="none" stroke="#5B21B6" stroke-width="4"/>
          <circle cx="520" cy="270" r="14" fill="#1e293b"/>
          <!-- 砂盤旋轉 -->
          <path d="M 450 250 Q 450 290 490 305" stroke="#fff" stroke-width="3" fill="none" opacity=".6"/>
          <polygon points="490,305 480,300 488,312" fill="#fff" opacity=".8"/>
          <!-- 工作檯 -->
          <rect x="430" y="345" width="180" height="10" fill="#5B21B6"/>
          <rect x="440" y="320" width="80" height="30" rx="3" fill="#5B21B6"/>
        </g>

        <!-- 集塵口 -->
        <g filter="url(#m1sShadow)">
          <rect x="320" y="350" width="40" height="55" fill="#1e293b"/>
          <circle cx="340" cy="380" r="18" fill="#0f172a"/>
          <circle cx="340" cy="380" r="12" fill="#5B21B6"/>
          <text x="340" y="418" text-anchor="middle" font-size="9" fill="#A78BFA" font-weight="800" font-family="Inter">DUST PORT</text>
        </g>

        <!-- 開關區 -->
        <g filter="url(#m1sShadow)">
          <rect x="100" y="445" width="50" height="30" rx="3" fill="#1e293b"/>
          <rect x="108" y="455" width="20" height="12" fill="#22c55e"/>
          <text x="118" y="479" font-size="8" fill="#A78BFA" font-weight="700" font-family="Inter">ON</text>
        </g>
        <g filter="url(#m1sShadow)">
          <circle cx="200" cy="460" r="18" fill="#dc2626"/>
          <circle cx="200" cy="460" r="12" fill="#fff"/>
          <text x="200" y="464" text-anchor="middle" font-size="9" font-weight="800" fill="#dc2626">STOP</text>
        </g>

        <!-- 砂帶張力調整 -->
        <g filter="url(#m1sShadow)">
          <rect x="100" y="240" width="36" height="40" rx="3" fill="#1e293b"/>
          <circle cx="118" cy="260" r="10" fill="#A78BFA"/>
          <circle cx="118" cy="260" r="3" fill="#1e293b"/>
          <text x="118" y="295" text-anchor="middle" font-size="8" fill="#A78BFA" font-weight="700" font-family="Inter">TENSION</text>
        </g>

        <!-- 馬達 -->
        <g filter="url(#m1sShadow)">
          <rect x="265" y="360" width="80" height="30" rx="4" fill="#1e293b"/>
          <g stroke="#5B21B6" stroke-width="1" opacity=".6">
            <line x1="275" y1="365" x2="275" y2="385"/>
            <line x1="285" y1="365" x2="285" y2="385"/>
            <line x1="295" y1="365" x2="295" y2="385"/>
            <line x1="305" y1="365" x2="305" y2="385"/>
            <line x1="315" y1="365" x2="315" y2="385"/>
          </g>
          <text x="305" y="408" text-anchor="middle" font-size="9" fill="#A78BFA" font-weight="700" font-family="Inter">MOTOR</text>
        </g>

        <!-- 標籤 -->
        <text x="265" y="100" text-anchor="middle" font-size="14" fill="#5B21B6" font-weight="800" font-family="Inter">BELT SANDER 帶式</text>
        <text x="520" y="180" text-anchor="middle" font-size="14" fill="#5B21B6" font-weight="800" font-family="Inter">DISC SANDER 盤式</text>

        <!-- 互動熱點 -->
        <g id="hotspots">
          <g class="hotspot-group" data-id="belt"><circle class="hotspot-pulse" cx="265" cy="208" r="14"><animate attributeName="r" values="14;22;14" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle><circle class="hotspot" cx="265" cy="208" r="14"/><text class="hotspot-label" x="265" y="212">1</text></g>
          <g class="hotspot-group" data-id="disc"><circle class="hotspot" cx="520" cy="270" r="14"/><text class="hotspot-label" x="520" y="274">2</text></g>
          <g class="hotspot-group" data-id="motor"><circle class="hotspot" cx="305" cy="378" r="14"/><text class="hotspot-label" x="305" y="382">3</text></g>
          <g class="hotspot-group" data-id="fence"><circle class="hotspot" cx="265" cy="166" r="14"/><text class="hotspot-label" x="265" y="170">4</text></g>
          <g class="hotspot-group" data-id="switch"><circle class="hotspot" cx="125" cy="460" r="14"/><text class="hotspot-label" x="125" y="464">5</text></g>
          <g class="hotspot-group" data-id="dust"><circle class="hotspot" cx="340" cy="380" r="14"/><text class="hotspot-label" x="340" y="384">6</text></g>
          <g class="hotspot-group" data-id="tension"><circle class="hotspot" cx="118" cy="260" r="14"/><text class="hotspot-label" x="118" y="264">7</text></g>
          <g class="hotspot-group" data-id="stop"><circle class="hotspot" cx="200" cy="460" r="14"/><text class="hotspot-label" x="200" y="464">8</text></g>
        </g>
      </svg>
    </div>
    <div class="parts-info" id="parts-info">
      <div class="empty"><div class="empty-icon">👆</div><p style="font-size:16px;font-weight:600">點擊紫色數字</p><p style="font-size:13px;opacity:.7">8 個部件都認完才能進下一關</p></div>
    </div>
  </div>
  <div class="parts-checklist" id="parts-checklist"></div>

    <!-- TRIPO-3D --><section class="panel">
    <h3>🔭 寫實 3D 模型 <span style="font-size:12px;font-weight:500;color:#64748b;margin-left:6px">旋轉 · 縮放</span></h3>
    <p class="muted" style="margin-bottom:14px">拖曳可旋轉、滾輪縮放，從各角度認識砂磨機的外觀構造。<span style="font-size:12px;color:#94a3b8">（AI 生成示意模型，僅供認識外形）</span></p>
    <div style="background:#1e293b;border-radius:14px;overflow:hidden">
      <model-viewer src="../assets/models/sander.glb" camera-controls auto-rotate auto-rotate-delay="0" rotation-per-second="20deg" environment-image="neutral" shadow-intensity="1" style="width:100%;height:360px;--poster-color:#1e293b"></model-viewer>
    </div>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  </section>
<section class="panel">
    <h3>🖥️ 3D 模型檢視</h3>
    <p class="muted" style="margin-bottom:14px">OpenSCAD 繪製的帶盤式砂磨機模型，左側橫向砂帶、右側直立砂盤，含靠尺與集塵口。</p>
    <div style="display:flex;align-items:center;justify-content:center;background:#1E293B;border-radius:12px;padding:24px;border:1px solid var(--border)">
      <img src="../../models/sander/sander-iso.png" alt="砂磨機 3D 模型" style="max-width:400px;width:100%;image-rendering:crisp-edges">
    </div>
    <p style="font-size:11px;color:var(--text-muted);margin-top:10px;text-align:center">
      🖥️ 模型由 OpenSCAD 參數化建模繪製
    </p>
  </section>

  <div class="module-nav-bottom"><a href="../index.html" class="btn btn-ghost">← 回首頁</a><a href="module2.html" class="btn btn-primary" id="next-btn" style="opacity:.4;pointer-events:none">下一關：安全規範 →</a></div>
