  <div class="module-header"><div><span class="module-step" style="background:var(--purple-light);color:#6f3aa6">MODULE 05</span><h2>砂磨故障圖鑑</h2><p class="muted">8 種最常見的砂磨問題與預防方法。</p></div></div>
  <section class="panel"><h3>故障與預防對照</h3><div id="error-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px"></div></section>
  <section class="panel"><h3>砂磨「四不一定」</h3>
    <div style="background:var(--bg-soft);border-radius:14px;padding:20px;line-height:1.9">
      <ul style="padding-left:24px;color:var(--text-soft);font-size:15px">
        <li><strong>不停留</strong>—工件不可在砂帶某一點停超過 2 秒</li>
        <li><strong>不戴套</strong>—禁戴布手套，會被砂帶捲入</li>
        <li><strong>不跳級</strong>—粒度循序漸進，60→80→120→180</li>
        <li><strong>不徒手</strong>—小工件用木夾，不徒手捏</li>
        <li><strong>一定要</strong>—集塵連接、護目鏡、N95 口罩</li>
      </ul>
    </div>
  </section>
